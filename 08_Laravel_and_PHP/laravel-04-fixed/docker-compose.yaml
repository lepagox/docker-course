version: '3.8'

services:
  server:
    # instead of using standard image we're going to add copying source code and conf
    # in a separate Dockerfile now
    # image: 'nginx:stable-alpine'
    build: # here it's important to set context as . and not ./dockerfiles as in the ngnix.dockerfile
    # we're referring to the nginx folder and to the src folder in host machine, which are both outside of the dockerfiles folder
    # so they would be unreachable otherwise
      context: .
      dockerfile: dockerfiles/nginx.dockerfile
    ports:
      - '8000:80'
    volumes:
      - ./src:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - mysql
  php:
    build:
      context: .
      dockerfile: dockerfiles/php.dockerfile
    volumes:
      - ./src:/var/www/html:delegated # delegated here means source code changes aren't reflected immediately but ratheri in batches
    # no need for port mapping 9000:3000 as container to container so just update nginx.conf with port 9000 to talk to php
  mysql:
    image: mysql:5.7
    env_file:
      - ./env/mysql.env
  composer:
    build:
      context: ./dockerfiles
      dockerfile: composer.dockerfile
    volumes:
      - ./src:/var/www/html
  artisan:
    build:
      context: .
      dockerfile: dockerfiles/php.dockerfile
    volumes:
      - ./src:/var/www/html
    # added here instead of having a separate Dockerfile for artisan (will add or override dockerfile above)
    entrypoint: ['php', '/var/www/html/artisan'] 
  npm:
    image: node:14
    # could put the below working_dir and entrypoint into our own Dockerfile but just showing it can be done here
    working_dir: /var/www/html
    entrypoint: ['npm']
    volumes:
      - ./src:/var/www/html
